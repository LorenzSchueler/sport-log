name: SQL

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: install postgresql
      run: |
        sudo apt-get update -y
        sudo apt-get install libpq-dev postgresql
    - name: setup postgresql
      run: |
        sudo systemctl start postgresql
        sudo -u postgres createuser --createdb sport_admin
        echo "sport-log $(whoami) sport_admin" | sudo tee -a /etc/postgresql/*/main/pg_ident.conf
        sudo sed -i '/^local\s\+all\s\+all\s\+peer/i local all sport_admin peer map=sport-log' /etc/postgresql/*/main/pg_hba.conf
        sudo systemctl reload postgresql
    - name: install diesel_cli
      run: cargo install diesel_cli --no-default-features --features postgres
    - name: setup database
      working-directory: sport-log-types
      run: diesel database setup # --locked-schema # TODO
    - name: revert migrations
      working-directory: sport-log-types
      run: diesel migration revert --all
    - name: run migrations
      working-directory: sport-log-types
      run: diesel migration run
