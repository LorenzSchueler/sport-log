name: Rust

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: cargo fmt
      run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: cargo clippy
      run: cargo clippy --all-features --examples --tests -- --deny warnings
    
  doc:
    name: doc
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: cargo doc
      env:
        RUSTDOCFLAGS: "-D warnings" 
      run: cargo doc --no-deps --all-features

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: cargo build
      # build every crate on its own to make sure enabled features from other crates do not mask missing dependencies
      run: cargo build --manifest-path sport-log-action-provider-boxbase-login/Cargo.toml &&
           cargo build --manifest-path sport-log-ap-utils/Cargo.toml &&
           cargo build --manifest-path sport-log-scheduler/Cargo.toml &&
           cargo build --manifest-path sport-log-server/Cargo.toml &&
           cargo build --manifest-path sport-log-types/Cargo.toml &&
           cargo build --manifest-path sport-log-derive/Cargo.toml

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: install postgresql
      run: |
        sudo apt-get update -y
        sudo apt-get install libpq-dev postgresql
    - name: setup postgresql
      run: |
        sudo systemctl start postgresql
        sudo -u postgres createuser --createdb sport_admin
        echo "sport-log $(whoami) sport_admin" | sudo tee -a /etc/postgresql/*/main/pg_ident.conf
        sudo sed -i '/^local\s\+all\s\+all\s\+peer/i local all sport_admin peer map=sport-log' /etc/postgresql/*/main/pg_hba.conf
        sudo systemctl reload postgresql
    - name: install diesel_cli
      run: cargo install diesel_cli --no-default-features --features postgres
    - name: setup database
      working-directory: sport-log-types
      run: |
        diesel database setup # --locked-schema TODO
        patch src/schema.rs src/schema.patch # TODO
    - name: create sport-log-server.toml file
      working-directory: sport-log-server
      run: cp sport-log-server.toml.template sport-log-server.toml
    - name: cargo test
      run: cargo test --all-features

  test-end-to-end:
    name: test-end-to-end
    runs-on: ubuntu-latest

    env:
      USERNAME: ScreenshotUser
      PASSWORD: ScreenshotPassword0
      AP_USERNAME: wodify-login
      AP_PASSWORD: Wodify-Login-Password1
      ADMIN_PASSWORD: admin-passwd
      BASE_URL: http://localhost:8001

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: install postgresql
      run: |
        sudo apt-get update -y
        sudo apt-get install libpq-dev postgresql
    - name: setup postgresql
      run: |
        sudo systemctl start postgresql
        sudo -u postgres createuser --createdb sport_admin
        echo "sport-log $(whoami) sport_admin" | sudo tee -a /etc/postgresql/*/main/pg_ident.conf
        sudo sed -i '/^local\s\+all\s\+all\s\+peer/i local all sport_admin peer map=sport-log' /etc/postgresql/*/main/pg_hba.conf
        sudo systemctl reload postgresql
    - name: install diesel_cli
      run: cargo install diesel_cli --no-default-features --features postgres
    - name: setup database
      working-directory: sport-log-types
      run: |
        diesel database setup # --locked-schema TODO
        patch src/schema.rs src/schema.patch # TODO
    - name: create sport-log-server.toml file
      working-directory: sport-log-server
      run: cp sport-log-server.toml.template sport-log-server.toml
    - name: run server
      working-directory: sport-log-server
      run: |
        set -e

        cargo build
        cargo run &
        sleep 1
    - name: test end-to-end
      working-directory: test
      run: ./end-to-end.sh

  deps:
    name: unused deps
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: load cache
      uses: Swatinem/rust-cache@v2
    - name: install cargo-machete
      run: cargo install cargo-machete
    - name: cargo machete
      run: cargo machete
